name: Deploy Frontend QA

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/deploy-frontend-qa.yml'

concurrency:
  group: fe-qa
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build QA
        run: npm run build:qa

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync hashed assets
        run: |
          aws s3 sync dist/timbrapp-ui/browser "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync html and json (no-cache)
        run: |
          aws s3 sync dist/timbrapp-ui/browser "s3://${{ vars.S3_BUCKET }}" \
            --exclude "*" \
            --include "index.html" \
            --include "*.json" \
            --cache-control "no-cache,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DIST_ID }}" \
            --paths "/index.html" "/"
