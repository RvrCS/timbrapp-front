@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"
       (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-5xl max-h-[85vh] flex flex-col"
         (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between flex-shrink-0 gap-3">
        <h3 class="text-sm font-bold text-slate-800">{{ title() }}</h3>
        <button (click)="addRow()"
          class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition-colors border border-indigo-200 flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          {{ addLabel() }}
        </button>
      </div>

      <!-- Body: table (own scroll) -->
      <div class="flex-1 min-h-0 overflow-y-auto">
        <app-conceptos-table
          class="block h-full"
          [columns]="columns()"
          [rows]="workingRows()"
          mode="edit"
          [showRemove]="true"
          [emptyMessage]="emptyMessage()"
          (remove)="removeRow($event)"
          (cellChange)="onInnerCellChange($event)" />
      </div>

      <!-- Footer -->
      <div class="px-5 py-4 border-t border-slate-200 flex-shrink-0 flex flex-col sm:flex-row gap-3 sm:justify-end">
        <button (click)="onCancel()"
          class="w-full sm:w-auto px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
          Cancelar
        </button>
        <button (click)="onConfirm()"
          class="w-full sm:w-auto px-4 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition-colors">
          Confirmar
        </button>
      </div>

    </div>
  </div>
}
