<!-- Barra de acción — oculta al imprimir -->
<div class="no-print sticky top-0 z-10 bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between gap-3">
  <a routerLink="/documentacion" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-800 transition-colors">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
    Volver a la documentación
  </a>
  <button (click)="print()"
    class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
    <lucide-icon name="download" [size]="16"></lucide-icon>
    Imprimir / Guardar como PDF
  </button>
</div>

<div class="doc-print max-w-3xl mx-auto px-6 py-10 sm:px-10">

  <div class="mb-10">
    <p class="text-xs font-bold text-indigo-600 tracking-wide uppercase mb-2">Manual de usuario</p>
    <h1 class="text-3xl font-bold text-slate-900">Documentación de TimbrApp</h1>
    <p class="text-sm text-slate-500 mt-2">Guía completa: primeros pasos y cada tipo de comprobante, explicado a detalle.</p>
  </div>

  <section class="doc-section">
    <app-doc-primeros-pasos />
  </section>

  <section class="doc-section">
    <app-doc-ingreso />
  </section>

  <section class="doc-section">
    <app-doc-egreso />
  </section>

  <section class="doc-section">
    <app-doc-pago />
  </section>

  <section class="doc-section">
    <app-doc-traslado />
  </section>

  <section class="doc-section">
    <app-doc-nomina />
  </section>

  <section class="doc-section">
    <app-doc-faq />
  </section>

  <section class="doc-section">
    <app-doc-glosario />
  </section>

  <footer class="mt-12 pt-6 border-t border-slate-200 text-xs text-slate-400">
    ¿Algo no quedó claro? Contacta a soporte y con gusto te ayudamos. — TimbrApp
  </footer>

</div>
