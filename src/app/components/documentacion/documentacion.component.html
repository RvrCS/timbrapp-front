<div class="p-6 max-w-6xl mx-auto">

  <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold text-slate-900">Documentación</h1>
      <p class="text-sm text-slate-500 mt-0.5">Guía completa de TimbrApp — desde tu primera factura hasta cada tipo de comprobante.</p>
    </div>
    <a routerLink="/documentacion/imprimir" target="_blank"
       class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 transition-colors shadow-sm w-full sm:w-auto flex-shrink-0">
      <lucide-icon name="download" [size]="16"></lucide-icon>
      Descargar PDF
    </a>
  </div>

  <div class="flex flex-col lg:flex-row gap-6 items-start">

    <!-- Nav lateral — fila horizontal scrollable en mobile, columna fija en desktop -->
    <nav class="w-full lg:w-56 lg:flex-shrink-0 lg:sticky lg:top-6">
      <div class="flex lg:flex-col gap-1 overflow-x-auto lg:overflow-visible pb-1 lg:pb-0">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route"
             routerLinkActive="!bg-indigo-50 !text-indigo-700"
             [routerLinkActiveOptions]="{exact: item.route === '/documentacion'}"
             class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors whitespace-nowrap flex-shrink-0 lg:flex-shrink lg:whitespace-normal">
            <lucide-icon [name]="item.icon" [size]="16" class="flex-shrink-0"></lucide-icon>
            {{ item.label }}
          </a>
        }
      </div>
    </nav>

    <!-- Contenido -->
    <div class="flex-1 min-w-0 w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
      <router-outlet />
    </div>

  </div>

</div>
