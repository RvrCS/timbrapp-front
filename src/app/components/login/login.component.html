<div class="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">

      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <img
          src="login-lockup-logo.svg"
          alt="TimbrApp"
          class="w-full h-auto object-contain"
        />
      </div>

      <!-- Error -->
      @if (error()) {
        <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg flex items-center gap-2 text-sm text-red-700">
          <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          {{ error() }}
        </div>
      }

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" novalidate class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Correo electrónico
          </label>
          <input
            type="email"
            [value]="email()"
            (input)="onEmailInput($event)"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-slate-400 transition"
            [class.border-red-300]="error()"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <input
              [type]="showPw() ? 'text' : 'password'"
              [value]="password()"
              (input)="onPasswordInput($event)"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-slate-400 transition"
              [class.border-red-300]="error()"
            />
            <button
              type="button"
              (click)="togglePw()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition"
              tabindex="-1"
            >
              @if (showPw()) {
                <!-- eye-off -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              } @else {
                <!-- eye -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white text-sm font-semibold rounded-lg transition shadow-sm flex items-center justify-center gap-2"
        >
          @if (loading()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
            Ingresando...
          } @else {
            Iniciar sesión
          }
        </button>

      </form>

      <!-- Hint -->
      <p class="mt-6 text-center text-xs text-slate-400">
        ¿Olvidaste tu contraseña?
        <a href="#" class="text-indigo-600 hover:underline">Contáctanos</a>
      </p>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      TimbrApp &mdash; Rinarasoft © {{ currentYear }}
    </p>
  </div>
</div>
